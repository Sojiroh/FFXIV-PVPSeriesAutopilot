<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1f4f7a"/>
      <stop offset="0.55" stop-color="#132a4a"/>
      <stop offset="1" stop-color="#0a1426"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe8ff"/>
      <stop offset="1" stop-color="#3a8dff"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9d4ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#e09a2b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- autopilot dial -->
  <g transform="translate(256 268)">
    <circle r="178" fill="none" stroke="#7fe8ff" stroke-opacity="0.12" stroke-width="30"/>
    <circle r="178" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>
    <g stroke="#9fefff" stroke-linecap="round">
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(0)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(30)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(60)"/>
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(90)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(120)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(150)"/>
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(180)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(210)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(240)"/>
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(270)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(300)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(330)"/>
    </g>
  </g>

  <!-- heading chevron above the dial -->
  <path d="M256 34 L300 104 L256 86 L212 104 Z" fill="url(#gold)" filter="url(#glow)"/>

  <!-- crossed swords -->
  <g transform="translate(256 272)" filter="url(#glow)">
    <g transform="rotate(45)">
      <path d="M-11 -150 L0 -176 L11 -150 L11 52 L-11 52 Z" fill="url(#blade)"/>
      <rect x="-40" y="52" width="80" height="14" rx="7" fill="url(#gold)"/>
      <rect x="-8" y="66" width="16" height="42" rx="5" fill="#5a3a1c"/>
      <circle cy="116" r="11" fill="url(#gold)"/>
    </g>
    <g transform="rotate(-45)">
      <path d="M-11 -150 L0 -176 L11 -150 L11 52 L-11 52 Z" fill="url(#blade)"/>
      <rect x="-40" y="52" width="80" height="14" rx="7" fill="url(#gold)"/>
      <rect x="-8" y="66" width="16" height="42" rx="5" fill="#5a3a1c"/>
      <circle cy="116" r="11" fill="url(#gold)"/>
    </g>
  </g>

  <!-- center hub -->
  <circle cx="256" cy="272" r="34" fill="#0d1d36" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="256" cy="272" r="12" fill="#9fefff"/>
</svg>
